steps:
# 1. Build Container Image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/gcloud-learn:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/gcloud-learn:latest', '.']

# 2. Push Container Image to Google Container Registry / Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/gcloud-learn:$COMMIT_SHA']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/gcloud-learn:latest']

# 3. Deploy Container to Cloud Run (Serverless) in Paris (europe-west9)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'gcloud-learn'
  - '--image'
  - 'gcr.io/$PROJECT_ID/gcloud-learn:$COMMIT_SHA'
  - '--region'
  - 'europe-west9'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--memory'
  - '512Mi'
  - '--cpu'
  - '1'

images:
- 'gcr.io/$PROJECT_ID/gcloud-learn:$COMMIT_SHA'
- 'gcr.io/$PROJECT_ID/gcloud-learn:latest'
