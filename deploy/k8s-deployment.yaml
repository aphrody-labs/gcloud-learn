apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcloud-learn
  labels:
    app: gcloud-learn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gcloud-learn
  template:
    metadata:
      labels:
        app: gcloud-learn
    spec:
      containers:
      - name: gcloud-learn
        image: gcr.io/aphrody/gcloud-learn:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        env:
        - name: PORT
          value: "8080"
        - name: GCP_PROJECT
          value: "aphrody"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gcloud-learn-service
spec:
  type: ClusterIP
  selector:
    app: gcloud-learn
  ports:
  - port: 80
    targetPort: 8080
